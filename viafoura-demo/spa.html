<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPA Navigation Demo | Beau's Viafoura Implementation</title>

  <!-- Viafoura meta tags (initial page) -->
  <meta name="vf:container_id" content="P3001">
  <meta property="og:url" content="https://www.beaulazear.com/viafoura-demo/spa.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Single-Page Application Navigation Demo">
  <meta property="og:description" content="Demonstration of dynamic content loading with proper Viafoura context updates.">
  <meta property="og:image" content="https://www.beaulazear.com/viafoura-demo/assets/images/spa-ai.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Site assets -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="assets/site.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="brand"><img src="assets/viafoura-icon-red.webp" alt="" width="28" height="28">Beau's Viafoura Implementation</a>
    <nav>
      <a href="conversations.html">Conversations</a>
      <a href="live-blog.html">Live Blog</a>
      <a href="live-qa.html">Live Q&A</a>
      <a href="live-chat.html">Live Chat</a>
      <a href="polls.html">Polls</a>
      <a href="reviews.html">Reviews</a>
      <a href="community.html">Community Tools</a>
      <a href="spa.html" aria-current="page">SPA Demo</a>
    </nav>
  </header>

  <main>

    <div class="spa-controls">
      <h3>Load Different Articles</h3>
      <button id="article-1" class="active">Article 1: AI and Society</button>
      <button id="article-2">Article 2: Sustainable Energy</button>
      <button id="article-3">Article 3: Future of Work</button>

      <label>
        <input type="checkbox" id="analytics-toggle" checked>
        Fire analytics events on navigation (check VF Events debug panel)
      </label>
    </div>

    <!-- Article content container -->
    <div id="article-content">
      <!-- Content will be dynamically inserted here -->
    </div>

    <!-- Viafoura Conversations Widget -->
    <div class="viafoura">
      <vf-conversations></vf-conversations>
    </div>

    <!-- Viafoura Tray Trigger -->
    <div class="viafoura">
      <vf-tray-trigger floating="true"></vf-tray-trigger>
    </div>
  </main>

  <!-- SPA Navigation Script -->
  <script>
    (function() {
      'use strict';

      // Article data
      const articles = {
        'article-1': {
          containerId: 'P3001',
          image: 'assets/images/spa-ai.jpg',
          title: 'Artificial Intelligence and Its Impact on Modern Society',
          author: 'Dr. Emily Chen',
          date: '2026-11-01',
          readTime: '7 min read',
          content: `
            <p>Artificial intelligence has moved from science fiction to everyday reality, transforming how we work, communicate, and solve complex problems. From personalized recommendations to autonomous vehicles, AI systems are becoming increasingly integrated into the fabric of modern life.</p>

            <p>But with this integration comes important questions about ethics, bias, and the future of human labor. As AI systems become more capable, we must grapple with fundamental questions about privacy, accountability, and the kind of society we want to build.</p>

            <p>Recent advances in large language models, computer vision, and reinforcement learning have accelerated AI capabilities beyond what many experts predicted even five years ago. These tools are now being deployed in healthcare, education, creative industries, and scientific research.</p>

            <p>The challenge ahead is not whether AI will continue to advance—it almost certainly will—but how we choose to develop and deploy these powerful technologies in ways that benefit humanity while mitigating potential harms.</p>
          `
        },
        'article-2': {
          containerId: 'P3002',
          image: 'assets/images/spa-energy.jpg',
          title: 'The Global Transition to Sustainable Energy',
          author: 'James Morrison',
          date: '2026-10-28',
          readTime: '6 min read',
          content: `
            <p>The world is undergoing a historic energy transformation. Solar and wind power have become the cheapest sources of electricity in most markets, and battery technology has advanced to the point where renewable energy can be stored and dispatched on demand.</p>

            <p>This transition is being driven by a combination of technological innovation, policy support, and economic necessity. The falling costs of renewable energy and energy storage have made clean energy not just an environmental imperative but an economic opportunity.</p>

            <p>Countries around the world are setting ambitious targets for decarbonization. The European Union aims to be climate neutral by 2050, China has pledged to reach carbon neutrality by 2060, and over 100 countries have set net-zero targets.</p>

            <p>While challenges remain—including grid infrastructure upgrades, energy storage capacity, and the intermittency of renewable sources—the momentum toward sustainable energy appears irreversible. The question is no longer if the transition will happen, but how quickly it can be achieved.</p>
          `
        },
        'article-3': {
          containerId: 'P3003',
          image: 'assets/images/spa-work.jpg',
          title: 'The Future of Work in a Digital Age',
          author: 'Sarah Williams',
          date: '2026-10-25',
          readTime: '8 min read',
          content: `
            <p>The nature of work is changing at an unprecedented pace. Remote work, once considered a perk, has become standard practice for millions of knowledge workers. Digital collaboration tools have made distributed teams not just possible but often preferable to traditional office environments.</p>

            <p>This shift has profound implications for how we think about productivity, work-life balance, and career development. Companies are rethinking everything from performance metrics to organizational structure to accommodate this new reality.</p>

            <p>At the same time, automation and AI are reshaping entire job categories. While some roles are being automated, new categories of work are emerging that didn't exist a decade ago—from AI trainers to remote work consultants to digital wellness coaches.</p>

            <p>The workers and organizations that thrive in this new landscape will be those that embrace continuous learning, adaptability, and a willingness to reimagine what work means in the 21st century. The future of work isn't predetermined—it's being shaped by decisions we make today.</p>
          `
        }
      };

      // Current article ID
      let currentArticleId = 'article-1';

      // Render article content
      function renderArticle(articleId) {
        const article = articles[articleId];
        const contentContainer = document.getElementById('article-content');

        contentContainer.innerHTML = `
          <article>
            <h1>${article.title}</h1>

            <div class="byline">
              <div class="author">
                <span>By ${article.author}</span>
              </div>
              <time datetime="${article.date}">${new Date(article.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</time>
              <span>${article.readTime}</span>
            </div>

            <img class="hero" src="${article.image}" alt="" width="1200" height="800">

            ${article.content}
          </article>
        `;
      }

      // Update Viafoura context
      function updateViafouraContext(articleId) {
        const article = articles[articleId];

        // Queue the context update
        window.vfQ = window.vfQ || [];
        window.vfQ.push(function() {
          // Check if analytics is enabled
          const analyticsEnabled = document.getElementById('analytics-toggle').checked;

          // Update the page context
          window.vf.context.update({
            container_id: article.containerId,
            url: window.location.href,
            title: article.title,
            tags: articleId === 'article-1' ? ['technology', 'AI'] :
                  articleId === 'article-2' ? ['environment', 'energy'] :
                  ['business', 'workforce'],
            section_ids: ['tech-section'],
            disable_analytics: !analyticsEnabled
          });

          // Log to debug panel
          if (window.hlLog) {
            window.hlLog('SPA Navigation', {
              article_id: articleId,
              container_id: article.containerId,
              title: article.title,
              analytics_enabled: analyticsEnabled
            });
          }
        });
      }

      function setOgImage(url) {
        const ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage) ogImage.content = new URL(url, window.location.href).href; // og:image must be absolute
      }

      // Handle article navigation
      function navigateToArticle(articleId, updateHistory) {
        if (currentArticleId === articleId) return;

        // Update active button
        document.querySelectorAll('.spa-controls button').forEach(btn => {
          btn.classList.remove('active');
        });
        document.getElementById(articleId).classList.add('active');

        // Render new content
        renderArticle(articleId);

        // Keep the og:image meta tag in step with the article (trending thumbnails)
        setOgImage(articles[articleId].image);

        // Update Viafoura context
        updateViafouraContext(articleId);

        // Update browser history
        if (updateHistory) {
          const article = articles[articleId];
          const url = new URL(window.location);
          url.searchParams.set('article', articleId);
          window.history.pushState(
            { articleId: articleId },
            article.title,
            url.toString()
          );
        }

        currentArticleId = articleId;

        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Handle button clicks
      document.querySelectorAll('.spa-controls button').forEach(button => {
        button.addEventListener('click', function() {
          navigateToArticle(this.id, true);
        });
      });

      // Handle browser back/forward
      window.addEventListener('popstate', function(event) {
        if (event.state && event.state.articleId) {
          navigateToArticle(event.state.articleId, false);
        }
      });

      // Initialize on page load.
      // This runs synchronously (the script sits after the markup it needs) and,
      // importantly, BEFORE the async Viafoura SDK tag at the bottom of the page is
      // parsed. That lets us correct the vf:container_id meta tag for deep links
      // (e.g. spa.html?article=article-2) so the SDK boots with the right container
      // instead of loading P3001 and needing a second context update.
      (function init() {
        // Check URL for initial article (fall back to article-1 if missing/invalid)
        const urlParams = new URLSearchParams(window.location.search);
        const requested = urlParams.get('article');
        const initialArticle = articles[requested] ? requested : 'article-1';
        const article = articles[initialArticle];

        // Point the SDK's initial page context at the deep-linked article
        const containerMeta = document.querySelector('meta[name="vf:container_id"]');
        if (containerMeta) containerMeta.content = article.containerId;
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.content = article.title;
        const ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.content = window.location.href;
        setOgImage(article.image);

        // Sync internal state and active button with the URL
        currentArticleId = initialArticle;
        document.querySelectorAll('.spa-controls button').forEach(btn => {
          btn.classList.toggle('active', btn.id === initialArticle);
        });

        // Render initial article
        renderArticle(initialArticle);

        // Set initial history state
        window.history.replaceState(
          { articleId: initialArticle },
          article.title,
          window.location.href
        );
      })();
    })();
  </script>

  <!-- Viafoura SDK -->
  <script async src="https://cdn.viafoura.net/entry/index.js"></script>
</body>
</html>
